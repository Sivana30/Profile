<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional Portfolio Website" />
  <title>Sivana Amelia | Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <style>
    html { scroll-padding-top: 85px; }
    body { font-family: 'Poppins', sans-serif; overflow-x: hidden; transition: background-color 0.5s ease; }
    
    body:not(.dark) { background-color: #99C2FF; }
    .glass-nav { 
      background-color: rgba(102, 163, 255, 0.9); 
      backdrop-filter: blur(8px);
    }
    
    .dark body { background-color: #001433; }
    .dark .glass-nav {
      background-color: rgba(0, 14, 36, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    .nav-link { @apply relative transition-all duration-300; }
    .nav-link::after { content: ''; @apply absolute w-0 h-0.5 bg-white bottom-0 left-0 transition-all duration-300; }
    .nav-link:hover::after { @apply w-full; }
  </style>
</head>

<body class="text-gray-900 dark:text-gray-100">

<header class="fixed w-full z-50 transition-all duration-300 glass-nav shadow-md">
  <nav class="max-w-6xl mx-auto flex justify-between items-center p-4">
    <h1 class="text-xl font-bold tracking-tighter hover:scale-105 transition-transform cursor-default">
      SIVANA<span class="text-white dark:text-blue-400">.</span>
    </h1>
    <ul class="hidden md:flex gap-8 font-semibold">
      <li><a href="#home" class="nav-link hover:text-white dark:hover:text-blue-300">Home</a></li>
      <li><a href="#about" class="nav-link hover:text-white dark:hover:text-blue-300">About</a></li>
      <li><a href="#skills" class="nav-link hover:text-white dark:hover:text-blue-300">Skills</a></li>
      <li><a href="#projects" class="nav-link hover:text-white dark:hover:text-blue-300">Projects</a></li>
      <li><a href="#contact" class="nav-link hover:text-white dark:hover:text-blue-300">Contact</a></li>
    </ul>
    <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-blue-400 dark:hover:bg-blue-900 transition-all text-xl">
      <span class="dark:hidden">🌙</span>
      <span class="hidden dark:inline">☀️</span>
    </button>
  </nav>
</header>

<section id="home" class="pt-40 pb-20 flex items-center justify-center text-center">
  <div id="hero" class="max-w-2xl px-4" data-aos="fade-up"></div>
</section>

<section id="about" class="py-20 max-w-5xl mx-auto px-4 overflow-hidden border-t border-white/10 dark:border-blue-900/20">
  <div data-aos="fade-right">
    <h2 class="text-3xl font-bold mb-4 inline-block border-b-4 border-white dark:border-blue-500">About Me</h2>
    <p id="aboutText" class="text-lg leading-relaxed mt-4 font-medium dark:text-blue-100"></p>
  </div>
</section>

<section id="skills" class="py-20 bg-white/10 dark:bg-black/10 backdrop-blur-sm">
  <div class="max-w-5xl mx-auto px-4">
    <h2 class="text-3xl font-bold mb-10 text-center md:text-left" data-aos="fade-up">Expertise</h2>
    <div id="skillsContainer" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div>
  </div>
</section>

<section id="projects" class="py-20 max-w-6xl mx-auto px-4">
  <h2 class="text-3xl font-bold mb-10" data-aos="fade-up">Recent Works</h2>
  <div id="projectsContainer" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</section>

<section id="contact" class="py-20 bg-white/10 dark:bg-black/10 backdrop-blur-sm">
  <div class="max-w-4xl mx-auto px-4 text-center">
    <h2 class="text-3xl font-bold mb-4" data-aos="fade-up">Connect With Me</h2>
    <p class="mb-10 font-medium opacity-80" data-aos="fade-up" data-aos-delay="100">Let's collaborate or just say hi!</p>
    
    <div id="socialsContainer" class="flex flex-wrap justify-center gap-6" data-aos="zoom-in">
      </div>
  </div>
</section>

<footer class="text-center p-10 border-t border-white/10 dark:border-blue-900/30">
  <p class="font-medium opacity-70">© 2026 Sivana Amelia Irmayanti</p>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({ once: true, duration: 800 });

function toggleDarkMode() {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
}

if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.classList.add('dark');
}

fetch('data.json')
  .then(res => res.json())
  .then(data => {
    // Hero
    document.getElementById('hero').innerHTML = `
      <img src="${data.hero.image}" class="mx-auto rounded-full mb-8 w-44 h-44 object-cover shadow-2xl border-4 border-white dark:border-blue-500 p-1 hover:scale-105 transition-transform" />
      <h2 class="text-4xl md:text-5xl font-bold mb-3 tracking-tight">${data.hero.name}</h2>
      <p class="text-xl text-blue-900 dark:text-blue-400 font-bold mb-6 uppercase tracking-widest">${data.hero.title}</p>
      <p class="text-blue-950 dark:text-blue-100 text-lg max-w-lg mx-auto font-medium">${data.hero.description}</p>
    `;

    // About
    document.getElementById('aboutText').textContent = data.about;

    // Skills
    document.getElementById('skillsContainer').innerHTML = data.skills.map((skill, i) => `
      <div class="p-5 bg-white/20 dark:bg-blue-900/20 rounded-2xl border border-white/10 dark:border-blue-800/50 text-center font-bold backdrop-blur-sm hover:bg-white/40 transition-all cursor-default" data-aos="fade-up" data-aos-delay="${i*100}">
        ${skill}
      </div>
    `).join('');

    // Projects
    document.getElementById('projectsContainer').innerHTML = data.projects.map((p, i) => `
      <div class="bg-white/20 dark:bg-blue-900/20 rounded-2xl shadow-xl overflow-hidden border border-white/10 dark:border-blue-800/50 group" data-aos="fade-up" data-aos-delay="${i*200}">
        <div class="overflow-hidden h-48">
          <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" />
        </div>
        <div class="p-6 text-left">
          <h3 class="font-bold text-xl mb-2 text-blue-900 dark:text-blue-300">${p.title}</h3>
          <p class="text-blue-950 dark:text-blue-100 text-sm font-medium">${p.description}</p>
        </div>
      </div>
    `).join('');

    // Social Media
    document.getElementById('socialsContainer').innerHTML = data.socials.map((s, i) => `
      <a href="${s.link}" target="_blank" class="flex items-center gap-3 px-8 py-4 bg-white/30 dark:bg-blue-900/30 rounded-full border border-white/20 dark:border-blue-800/50 font-bold hover:bg-white dark:hover:bg-blue-600 transition-all hover:-translate-y-2 shadow-lg">
        <span class="text-2xl">${s.icon}</span>
        <span>${s.platform}</span>
      </a>
    `).join('');
  });
</script>
</body>
</html>
